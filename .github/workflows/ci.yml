name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DuplicateFinder.slnx

      - name: Build
        run: dotnet build DuplicateFinder.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/DuplicateFinder.Core.Tests -c Release --no-build
